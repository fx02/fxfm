[package]
name = "fxfm-core"
version = "0.1.28"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
dirs = "7"
libc = "0.2"
unicode-normalization = "0.1"
filetime = "0.2"
trash = "5"
encoding_rs = "0.8"
rand = "0.8"
# Exact: packing with ZipCrypto uses `zip::unstable` (may change in patch releases).
zip = { version = "=9.4.1", default-features = false, features = ["deflate", "deflate64", "aes-crypto", "time"] }
tar = "0.4"
flate2 = "1"
bzip2 = "0.6"
lzma-rust2 = { version = "0.25", default-features = false, features = ["std", "encoder", "optimization", "xz"] }
sevenz-rust2 = { version = "0.25", default-features = false, features = ["compress", "bzip2", "ppmd", "util"] }
argon2 = "0.5"
chacha20poly1305 = "0.10"
base64 = "0.22"
zeroize = "1"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync"] }
sha2 = "0.10"
russh = { version = "0.65", default-features = false, features = ["ring", "rsa", "flate2", "des"] }
russh-sftp = "3"
# Not used directly: lets russh decrypt PKCS#8 keys whose PBKDF2 uses HMAC-SHA1 (LibreSSL,
# older OpenSSL) or 3DES.
pkcs5 = { version = "0.8", features = ["sha1-insecure", "3des"] }
suppaftp = { version = "12.2", default-features = false, features = ["rustls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# Audio decoding for F3 audition (pure Rust; GSM 6.10 is our own, in audio/gsm.rs).
symphonia = { version = "0.6.1", default-features = false, features = ["wav", "aiff", "pcm", "adpcm", "mpa", "flac", "ogg", "vorbis", "isomp4", "aac"] }
symphonia-opus = "0.1.1"

[target.'cfg(target_os = "macos")'.dependencies]
# Trash with the place the item went to (for Undo); the `trash` crate drops it.
objc2-foundation = { version = "0.3", features = ["NSFileManager", "NSURL", "NSString", "NSError"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros", "net", "io-util", "process"] }
libunftp = { version = "0.24", default-features = false, features = ["ring"] }
unftp-sbe-fs = "0.4"
unftp-core = "0.1"
async-trait = "0.1"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
